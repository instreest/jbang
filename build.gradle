plugins {
	id "java"
	id "distribution"
	id "com.gradleup.shadow" version "8.3.9"
}

// JBangLite: a reduced JBang that only supports //JAVA, //DEPS and //SOURCES
// directives plus the compile/run machinery needed by java-call-hierarchy-exporter.
version = project.hasProperty('jbangVersion') ? project.property('jbangVersion') : '0.1.0-lite'

repositories {
	mavenCentral()
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
	// Maven dependency resolution (the one thing we really cannot re-implement ourselves)
	implementation "eu.maveniverse.maven.mima:context:2.4.36"
	runtimeOnly    "eu.maveniverse.maven.mima.runtime:standalone-static:2.4.36"
	implementation "org.slf4j:slf4j-nop:2.0.18"
	implementation "org.slf4j:jcl-over-slf4j:2.0.18"
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll(['--release', '8', '-Xlint:deprecation', '-Xlint:-options'])
}

tasks.withType(AbstractArchiveTask) {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	manifest {
		attributes(
			'Main-Class': 'dev.jbang.Main',
			'JBang-Version': project.version
		)
	}
}

shadowJar {
	mergeServiceFiles()
	// keep the license notices next to the bundled code
	from('LICENSE') { into 'META-INF'; rename { 'LICENSE-jbang.txt' } }
	from('THIRD-PARTY.md') { into 'META-INF'; rename { 'THIRD-PARTY-jbang.md' } }
	manifest {
		attributes(
			'Main-Class': 'dev.jbang.Main',
			'JBang-Version': project.version
		)
	}
	archiveFileName = "jbang.jar"
}

task versionTxt() {
	def out = layout.buildDirectory.file("tmp/version.txt")
	outputs.file(out)
	doLast {
		out.get().asFile.text = project.version
	}
}

def commonSpec = project.copySpec {
	from(shadowJar) {
		into 'bin'
	}
	from(versionTxt)
	from('LICENSE', 'THIRD-PARTY.md', 'README.md')
	from('src/main/scripts') {
		include 'jbang'
		include 'jbang.cmd'
		include 'jbang.ps1'
		into 'bin'
	}
}

distributions {
	main {
		distributionBaseName = 'jbang'
		contents {
			with commonSpec
		}
	}
}

// "latest" bundles use the fixed root folder name "jbang" so that the
// startup scripts can install them (jbang.tar / jbang.zip).
tasks.register('latestDistZip', Zip) {
	into('jbang') {
		with commonSpec
	}
	destinationDirectory = layout.buildDirectory.dir('distributions')
	archiveFileName = "jbang.zip"
}
tasks.register('latestDistTar', Tar) {
	into('jbang') {
		with commonSpec
	}
	destinationDirectory = layout.buildDirectory.dir('distributions')
	archiveFileName = "jbang.tar"
}
assemble.dependsOn latestDistZip, latestDistTar

assemble.dependsOn shadowJar

// ---------------------------------------------------------------------------
// Bundled runtime: a jlink-shrunk JDK 25 shipped next to jbang.jar so that
// neither JBangLite itself nor the scripts it runs need a JDK on the machine.
//
//   ./gradlew bundleDist                       (downloads Temurin 25 for this host)
//   ./gradlew bundleDist -PjlinkJdk=/path/jdk  (use a local JDK 25 with jmods)
//   ./gradlew bundleDist -PjlinkPlatform=windows-x64 -PjlinkJdkUrl=<url>
//
// Cross-building is possible: jlink of the JDK given by -PjlinkTool (or the
// host JDK running Gradle, if it is 25+) is run against the jmods of the
// downloaded target-platform JDK.
// ---------------------------------------------------------------------------

def jlinkModules = [
	'java.se',          // the whole standard API, scripts may use any of it
	'jdk.compiler',     // javac
	'jdk.unsupported',  // sun.misc.Unsafe etc. used by many libraries
	'jdk.charsets',     // extended charsets (e.g. MS932 on Japanese Windows)
	'jdk.localedata',   // locales other than English
	'jdk.zipfs',        // jar:/zip: file systems
].join(',')

def hostPlatform() {
	def os = System.getProperty('os.name').toLowerCase()
	def arch = System.getProperty('os.arch').toLowerCase()
	def osName = os.contains('win') ? 'windows' : (os.contains('mac') ? 'mac' : 'linux')
	def archName = (arch == 'aarch64' || arch == 'arm64') ? 'aarch64' : 'x64'
	return "${osName}-${archName}"
}

def jlinkPlatform = project.findProperty('jlinkPlatform') ?: hostPlatform()
def jlinkJavaVersion = project.findProperty('jlinkJavaVersion') ?: '25'
def jlinkOs = jlinkPlatform.split('-')[0]
def jlinkArch = jlinkPlatform.split('-')[1]
def jlinkExt = jlinkOs == 'windows' ? 'zip' : 'tar.gz'
def jlinkJdkUrl = project.findProperty('jlinkJdkUrl') ?:
	"https://api.adoptium.net/v3/binary/latest/${jlinkJavaVersion}/ga/${jlinkOs}/${jlinkArch}/jdk/hotspot/normal/eclipse"
def jlinkWorkDir = layout.buildDirectory.dir("jlink/${jlinkPlatform}")

tasks.register('downloadJlinkJdk') {
	description = "Downloads a JDK ${jlinkJavaVersion} (${jlinkPlatform}) to build from"
	def archive = jlinkWorkDir.map { it.file("jdk.${jlinkExt}") }
	def jdkDir = jlinkWorkDir.map { it.dir('jdk') }
	onlyIf { !project.hasProperty('jlinkJdk') }
	inputs.property('url', jlinkJdkUrl)
	outputs.dir(jdkDir)
	doLast {
		def out = archive.get().asFile
		out.parentFile.mkdirs()
		logger.lifecycle("Downloading ${jlinkJdkUrl}")
		// follow redirects across hosts/protocols (the Adoptium API redirects to GitHub)
		def url = new URL(jlinkJdkUrl)
		for (int i = 0; i < 10; i++) {
			def conn = (HttpURLConnection) url.openConnection()
			conn.instanceFollowRedirects = false
			conn.setRequestProperty('User-Agent', "JBangLite/${project.version}")
			def code = conn.responseCode
			if (code >= 300 && code < 400) {
				url = new URL(url, conn.getHeaderField('Location'))
				continue
			}
			if (code != 200) {
				throw new GradleException("HTTP ${code} downloading ${url}")
			}
			conn.inputStream.withStream { is -> out.withOutputStream { os -> os << is } }
			break
		}
		def tmp = new File(out.parentFile, 'jdk.tmp')
		project.delete(tmp, jdkDir)
		tmp.mkdirs()
		if (jlinkExt == 'zip') {
			ant.unzip(src: out, dest: tmp)
		} else {
			ant.untar(src: out, dest: tmp, compression: 'gzip')
		}
		// strip the single root folder of the archive
		def roots = tmp.listFiles().findAll { it.isDirectory() }
		def root = roots.size() == 1 ? roots[0] : tmp
		if (jlinkOs == 'mac' && new File(root, 'Contents/Home').isDirectory()) {
			root = new File(root, 'Contents/Home')
		}
		if (!root.renameTo(jdkDir.get().asFile)) {
			throw new GradleException("Could not move ${root} to ${jdkDir.get().asFile}")
		}
		project.delete(tmp, out)
	}
}

tasks.register('jlinkRuntime') {
	description = "Creates the shrunk JDK ${jlinkJavaVersion} runtime image for ${jlinkPlatform}"
	dependsOn 'downloadJlinkJdk'
	def runtimeDir = jlinkWorkDir.map { it.dir('runtime') }
	inputs.property('modules', jlinkModules)
	inputs.property('platform', jlinkPlatform)
	outputs.dir(runtimeDir)
	doLast {
		def jdkHome = project.hasProperty('jlinkJdk')
			? file(project.property('jlinkJdk'))
			: jlinkWorkDir.get().dir('jdk').asFile
		def jmods = new File(jdkHome, 'jmods')
		if (!jmods.isDirectory()) {
			throw new GradleException("No jmods directory in ${jdkHome}; a full JDK (not a jlink image) is required")
		}
		def toolHome = project.hasProperty('jlinkTool') ? file(project.property('jlinkTool'))
			: (jlinkPlatform == hostPlatform() ? jdkHome : file(System.getProperty('java.home')))
		def exe = System.getProperty('os.name').toLowerCase().contains('win') ? 'jlink.exe' : 'jlink'
		def jlink = new File(toolHome, "bin/${exe}")
		if (!jlink.isFile()) {
			throw new GradleException("jlink not found at ${jlink}; pass -PjlinkTool=<JDK ${jlinkJavaVersion} home>")
		}
		def out = runtimeDir.get().asFile
		project.delete(out)
		logger.lifecycle("Running ${jlink} (jmods from ${jmods})")
		exec {
			environment 'JAVA_TOOL_OPTIONS', ''
			commandLine jlink.absolutePath,
				'--module-path', jmods.absolutePath,
				'--add-modules', jlinkModules,
				'--strip-debug', '--no-header-files', '--no-man-pages',
				'--compress', 'zip-6',
				'--output', out.absolutePath
		}
	}
}

def bundleSpec = project.copySpec {
	with commonSpec
	from(tasks.named('jlinkRuntime')) {
		into 'runtime'
	}
}

tasks.register('bundleDistTar', Tar) {
	description = "Distribution with the bundled runtime (${jlinkPlatform})"
	into('jbang') { with bundleSpec }
	destinationDirectory = layout.buildDirectory.dir('distributions')
	compression = Compression.GZIP
	archiveFileName = "jbang-${project.version}-${jlinkPlatform}.tar.gz"
}

tasks.register('bundleDistZip', Zip) {
	description = "Distribution with the bundled runtime (${jlinkPlatform})"
	into('jbang') { with bundleSpec }
	destinationDirectory = layout.buildDirectory.dir('distributions')
	archiveFileName = "jbang-${project.version}-${jlinkPlatform}.zip"
}

tasks.register('bundleDist') {
	description = 'Builds jbang-<version>-<platform>.tar.gz and .zip including the jlink runtime'
	dependsOn 'bundleDistTar', 'bundleDistZip'
}
