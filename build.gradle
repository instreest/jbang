plugins {
	id "java"
	id "com.gradleup.shadow" version "8.3.9"
}

// JBangLite: a reduced JBang that runs single-file Java programs. The only
// deliverable is build/libs/jbanglite.jar, which misc/update-dist.sh copies to
// dist/ together with the launchers; there is no other distribution.
// misc/update-dist.sh passes -PjbangVersion so that the jar knows the source
// revision it was built from.
version = project.hasProperty('jbangVersion') ? project.property('jbangVersion') : '0.1.0-lite'

repositories {
	mavenCentral()
}

// The jar is pinned by SHA-256 where it is installed (jbanglite.properties), so
// the build that produces it has to be as fixed as that: the lock files record
// every resolved version, transitive ones included, and
// gradle/verification-metadata.xml records the checksum of every artifact that
// is downloaded to build it. A dependency that changes under us fails the build
// instead of ending up in a release.
//
//   ./gradlew --write-locks --write-verification-metadata sha256 build
//
// regenerates both after a version change.
dependencyLocking {
	lockAllConfigurations()
}

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
	// nullness annotations, required by the files mirrored from JBang
	implementation 'org.jspecify:jspecify:1.0.0'

	// Maven dependency resolution (the one thing we really cannot re-implement
	// ourselves), with the HTTP transport Maven itself ships
	implementation "eu.maveniverse.maven.mima:context:2.4.36"
	implementation "eu.maveniverse.maven.mima.runtime:standalone-static:2.4.36"
	implementation "org.apache.maven.resolver:maven-resolver-util:1.9.24"
	implementation "org.slf4j:slf4j-nop:2.0.18"

	// JSON, for the JDK index. Comes with maven-resolver-transport-http anyway;
	// declared because we use it ourselves
	implementation "com.google.code.gson:gson:2.13.2"

	// archive handling, for unpacking a downloaded JDK
	implementation "org.apache.commons:commons-compress:1.28.0"

	testImplementation platform("org.junit:junit-bom:5.14.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "org.hamcrest:hamcrest:3.0"
	// only for the launcher script tests, never shipped
	testImplementation "org.wiremock:wiremock:3.13.2"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll(['--release', '11', '-Xlint:deprecation', '-Xlint:-options'])
}

tasks.withType(AbstractArchiveTask) {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	manifest {
		attributes(
			'Main-Class': 'dev.jbang.Main',
			'JBang-Version': project.version
		)
	}
}

import com.github.jengelman.gradle.plugins.shadow.transformers.ApacheLicenseResourceTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.ApacheNoticeResourceTransformer

shadowJar {
	mergeServiceFiles()
	// The bundled libraries each carry their own META-INF/LICENSE and NOTICE,
	// and one file cannot hold several: without these the last one written wins
	// and the rest are lost, which is exactly what Apache-2.0 section 4(d) asks
	// us not to do. They merge the notices into one file instead.
	transform(ApacheLicenseResourceTransformer)
	transform(ApacheNoticeResourceTransformer) {
		projectName = 'JBangLite'
	}
	// keep this fork's own notices next to the bundled code, and the licenses
	// of the bundled libraries, which the transformers above do not carry over
	from('LICENSE') { into 'META-INF'; rename { 'LICENSE-jbang.txt' } }
	from('THIRD-PARTY.md') { into 'META-INF'; rename { 'THIRD-PARTY-jbang.md' } }
	from('misc/licenses') { into 'META-INF/licenses' }
	// a bundled library's module-info describes that library, not this jar
	exclude 'META-INF/versions/*/module-info.class'
	exclude 'module-info.class'
	manifest {
		attributes(
			'Main-Class': 'dev.jbang.Main',
			'JBang-Version': project.version,
			// plexus-utils ships Java 9/10/11 variants of two classes; without
			// this they are dead weight and the Java 8 versions are used
			'Multi-Release': 'true'
		)
	}
	archiveFileName = "jbanglite.jar"
}

assemble.dependsOn shadowJar
