plugins {
	id "java"
	id "com.gradleup.shadow" version "8.3.9"
}

// jkite: a reduced JBang that runs single-file Java programs. The only
// deliverable is build/libs/jkite.jar, which misc/update-dist.sh copies to
// dist/ together with the launchers; there is no other distribution.
// misc/update-dist.sh passes -PjkiteVersion so that the jar knows the source
// revision it was built from.
version = project.hasProperty('jkiteVersion') ? project.property('jkiteVersion') : '0.1.0-dev'

repositories {
	mavenCentral()
}

// The jar is pinned by SHA-256 where it is installed (jkite.properties), so
// the build that produces it has to be as fixed as that: the lock files record
// every resolved version, transitive ones included, and
// gradle/verification-metadata.xml records the checksum of every artifact that
// is downloaded to build it. A dependency that changes under us fails the build
// instead of ending up in a release.
//
//   ./gradlew --write-locks --write-verification-metadata sha256 build
//
// regenerates both after a version change.
dependencyLocking {
	lockAllConfigurations()
}

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

// MIMA decides which Maven Resolver comes in, and we use Resolver's own classes
// (JavaScopes, the descriptor policy) directly, so that one has to be declared
// too: keep it at the version MIMA brings, which the pom of the MIMA release
// names. The lock file makes a divergence visible in review.
def mimaVersion = "2.4.48"
def resolverVersion = "1.9.27"
def slf4jVersion = "2.0.18"

dependencies {
	// nullness annotations, required by the files mirrored from JBang
	implementation 'org.jspecify:jspecify:1.0.0'

	// Maven dependency resolution (the one thing we really cannot re-implement
	// ourselves), with the HTTP transport Maven itself ships
	implementation "eu.maveniverse.maven.mima:context:$mimaVersion"
	implementation "eu.maveniverse.maven.mima.runtime:standalone-static:$mimaVersion"
	implementation "org.apache.maven.resolver:maven-resolver-util:$resolverVersion"
	implementation "org.slf4j:slf4j-nop:$slf4jVersion"

	// JSON, for the JDK index. Comes with maven-resolver-transport-http anyway;
	// declared because we use it ourselves
	implementation "com.google.code.gson:gson:2.14.0"

	// archive handling, for unpacking a downloaded JDK
	implementation "org.apache.commons:commons-compress:1.28.0"

	constraints {
		// the HTTP transport brings the 1.7 line of the commons-logging bridge
		// while everything else is on 2.0; one SLF4J, not one and a half
		implementation("org.slf4j:jcl-over-slf4j:$slf4jVersion") {
			because "aligned with the rest of SLF4J"
		}
	}

	testImplementation platform("org.junit:junit-bom:5.14.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "org.hamcrest:hamcrest:3.0"
	// only for the launcher script tests, never shipped
	testImplementation "org.wiremock:wiremock:3.13.2"
}

test {
	useJUnitPlatform()
	// Downloads need the operator's consent (JKITE_NETWORK). Tests have no
	// terminal to give it on, so it is given here; the tests that are about the
	// consent itself set the variable themselves.
	environment 'JKITE_NETWORK', 'allow'
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll(['--release', '11', '-Xlint:deprecation', '-Xlint:-options'])
}

tasks.withType(AbstractArchiveTask) {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	manifest {
		attributes(
			'Main-Class': 'io.github.instreest.jkite.Main',
			// the attribute Package.getImplementationVersion() reads back
			'Implementation-Version': project.version,
			// and the one that says a manifest is ours, among the many a class
			// path holds
			'Jkite-Version': project.version
		)
	}
}

import com.github.jengelman.gradle.plugins.shadow.transformers.ApacheLicenseResourceTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.ApacheNoticeResourceTransformer

shadowJar {
	mergeServiceFiles()
	// The bundled libraries each carry their own META-INF/LICENSE and NOTICE,
	// and one file cannot hold several: without these the last one written wins
	// and the rest are lost, which is exactly what Apache-2.0 section 4(d) asks
	// us not to do. They merge the notices into one file instead.
	transform(ApacheLicenseResourceTransformer)
	transform(ApacheNoticeResourceTransformer) {
		// Without these the generated header names the Apache Software
		// Foundation as this project's copyright holder, which it is not.
		projectName = 'jkite'
		organizationName = 'Max Rydahl Andersen and the jkite contributors'
		organizationURL = 'https://github.com/instreest/jkite'
		inceptionYear = '2020'
	}
	// keep this fork's own notices next to the bundled code, and the licenses
	// of the bundled libraries, which the transformers above do not carry over
	from('LICENSE') { into 'META-INF'; rename { 'LICENSE-jkite.txt' } }
	from('THIRD-PARTY.md') { into 'META-INF'; rename { 'THIRD-PARTY.md' } }
	from('misc/licenses') { into 'META-INF/licenses' }
	// a bundled library's module-info describes that library, not this jar
	exclude 'META-INF/versions/*/module-info.class'
	exclude 'module-info.class'
	// likewise META-INF/DEPENDENCIES: it is one dependency's own list, and in
	// this jar it reads as ours while naming versions that are not here
	exclude 'META-INF/DEPENDENCIES'
	manifest {
		attributes(
			'Main-Class': 'io.github.instreest.jkite.Main',
			// what Version.current() asks for first: Package resolves it to the
			// jar this class came from, not to whichever jar is first on the
			// class path
			'Implementation-Version': project.version,
			// and the one that marks a manifest as ours, for when Package
			// cannot answer
			'Jkite-Version': project.version,
			// plexus-utils ships Java 9/10/11 variants of two classes; without
			// this they are dead weight and the Java 8 versions are used
			'Multi-Release': 'true'
		)
	}
	archiveFileName = "jkite.jar"
}

assemble.dependsOn shadowJar
