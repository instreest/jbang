plugins {
	id "java"
	id "com.gradleup.shadow" version "8.3.9"
}

// JBangLite: a reduced JBang that runs single-file Java programs. The only
// deliverable is build/libs/jbanglite.jar, which misc/update-dist.sh copies to
// dist/ together with the launchers; there is no other distribution.
// misc/update-dist.sh passes -PjbangVersion so that the jar knows the source
// revision it was built from.
version = project.hasProperty('jbangVersion') ? project.property('jbangVersion') : '0.1.0-lite'

repositories {
	mavenCentral()
}

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
	// nullness annotations, required by the files mirrored from JBang
	implementation 'org.jspecify:jspecify:1.0.0'

	// Maven dependency resolution (the one thing we really cannot re-implement ourselves)
	implementation "eu.maveniverse.maven.mima:context:2.4.36"
	implementation("eu.maveniverse.maven.mima.runtime:standalone-static:2.4.36") {
		// the HTTP transport (Apache HttpClient, Gson, the public suffix list)
		// is replaced by JdkHttpTransporterFactory on the JDK's HttpClient
		exclude group: 'org.apache.maven.resolver', module: 'maven-resolver-transport-http'
	}
	implementation "org.apache.maven.resolver:maven-resolver-spi:1.9.24"
	implementation "org.apache.maven.resolver:maven-resolver-util:1.9.24"
	implementation "org.apache.maven.resolver:maven-resolver-transport-file:1.9.24"
	// only for the ChecksumExtractor type in the signatures JBangLiteRuntime
	// overrides; the class is never loaded at run time
	compileOnly "org.apache.maven.resolver:maven-resolver-transport-http:1.9.24"
	implementation "org.slf4j:slf4j-nop:2.0.18"

	testImplementation platform("org.junit:junit-bom:5.14.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "org.hamcrest:hamcrest:3.0"
	// only for the launcher script tests, never shipped
	testImplementation "org.wiremock:wiremock:3.13.2"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll(['--release', '11', '-Xlint:deprecation', '-Xlint:-options'])
}

tasks.withType(AbstractArchiveTask) {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	manifest {
		attributes(
			'Main-Class': 'dev.jbang.Main',
			'JBangLite-Version': project.version
		)
	}
}

/**
 * Collects the LICENSE and NOTICE files of every bundled dependency into one
 * directory per artifact. A shadow jar otherwise has them all land on
 * META-INF/LICENSE and META-INF/NOTICE, where the last one written wins and
 * the rest are lost - and Apache-2.0 asks for the NOTICE of every work it
 * covers to travel with the distribution.
 */
tasks.register('collectNotices') {
	def outDir = layout.buildDirectory.dir('notices')
	def runtime = configurations.runtimeClasspath
	inputs.files(runtime)
	outputs.dir(outDir)
	inputs.dir('misc/notices')
	doLast {
		def root = outDir.get().asFile
		root.deleteDir()
		root.mkdirs()
		// texts we have to ship for artifacts that put none in their own jar
		copy { from 'misc/notices'; into root }
		runtime.resolvedConfiguration.resolvedArtifacts.each { artifact ->
			def id = artifact.moduleVersion.id
			def name = "${id.group}-${id.name}-${id.version}"
			zipTree(artifact.file).matching {
				include 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/COPYRIGHT*',
						'META-INF/licenses/**', 'about.html'
			}.files.each { f ->
				if (f.isFile() && f.length() > 0) {
					def target = new File(root, name)
					target.mkdirs()
					new File(target, f.name).bytes = f.bytes
				}
			}
		}
	}
}

shadowJar {
	dependsOn 'collectNotices'
	mergeServiceFiles()
	// keep the license notices next to the bundled code: JBangLite's own, and
	// one directory per dependency so that none overwrites another
	from('LICENSE') { into 'META-INF'; rename { 'LICENSE-jbanglite.txt' } }
	from('THIRD-PARTY.md') { into 'META-INF'; rename { 'THIRD-PARTY.md' } }
	from(layout.buildDirectory.dir('notices')) { into 'META-INF/notices' }
	manifest {
		attributes(
			'Main-Class': 'dev.jbang.Main',
			'JBangLite-Version': project.version
		)
	}
	archiveFileName = "jbanglite.jar"
}

assemble.dependsOn shadowJar
