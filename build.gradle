plugins {
	id "java"
	id "distribution"
	id "com.gradleup.shadow" version "8.3.9"
}

// JBangLite: a reduced JBang that only supports //JAVA, //DEPS and //SOURCES
// directives plus the compile/run machinery needed by java-call-hierarchy-exporter.
version = project.hasProperty('jbangVersion') ? project.property('jbangVersion') : '0.1.0-lite'

repositories {
	mavenCentral()
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
	// Maven dependency resolution (the one thing we really cannot re-implement ourselves)
	implementation "eu.maveniverse.maven.mima:context:2.4.36"
	runtimeOnly    "eu.maveniverse.maven.mima.runtime:standalone-static:2.4.36"
	implementation "org.slf4j:slf4j-nop:2.0.18"
	implementation "org.slf4j:jcl-over-slf4j:2.0.18"
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll(['--release', '8', '-Xlint:deprecation', '-Xlint:-options'])
}

tasks.withType(AbstractArchiveTask) {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	manifest {
		attributes(
			'Main-Class': 'dev.jbang.Main',
			'JBang-Version': project.version
		)
	}
}

shadowJar {
	mergeServiceFiles()
	manifest {
		attributes(
			'Main-Class': 'dev.jbang.Main',
			'JBang-Version': project.version
		)
	}
	archiveFileName = "jbang.jar"
}

task versionTxt() {
	def out = layout.buildDirectory.file("tmp/version.txt")
	outputs.file(out)
	doLast {
		out.get().asFile.text = project.version
	}
}

def commonSpec = project.copySpec {
	from(shadowJar) {
		into 'bin'
	}
	from(versionTxt)
	from('src/main/scripts') {
		include 'jbang'
		include 'jbang.cmd'
		include 'jbang.ps1'
		into 'bin'
	}
}

distributions {
	main {
		distributionBaseName = 'jbang'
		contents {
			with commonSpec
		}
	}
}

// "latest" bundles use the fixed root folder name "jbang" so that the
// startup scripts can install them (jbang.tar / jbang.zip).
tasks.register('latestDistZip', Zip) {
	into('jbang') {
		with commonSpec
	}
	destinationDirectory = layout.buildDirectory.dir('distributions')
	archiveFileName = "jbang.zip"
}
tasks.register('latestDistTar', Tar) {
	into('jbang') {
		with commonSpec
	}
	destinationDirectory = layout.buildDirectory.dir('distributions')
	archiveFileName = "jbang.tar"
}
assemble.dependsOn latestDistZip, latestDistTar

assemble.dependsOn shadowJar
