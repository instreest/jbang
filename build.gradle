import org.gradle.api.tasks.PathSensitivity
plugins {
	id "java"
	id "com.gradleup.shadow" version "8.3.9"
}

// jkite: a reduced JBang that runs single-file Java programs. The only
// deliverable is build/libs/jkite.jar, which misc/update-dist.sh copies to
// dist/ together with the launchers; there is no other distribution.
// misc/update-dist.sh passes -PjkiteVersion so that the jar knows the source
// revision it was built from.
version = project.hasProperty('jkiteVersion') ? project.property('jkiteVersion') : '0.1.0-dev'

repositories {
	mavenCentral()
}

// The jar is pinned by SHA-256 where it is installed (jkite.properties), so
// the build that produces it has to be as fixed as that: the lock files record
// every resolved version, transitive ones included, and
// gradle/verification-metadata.xml records the checksum of every artifact that
// is downloaded to build it. A dependency that changes under us fails the build
// instead of ending up in a release.
//
//   ./gradlew --write-locks --write-verification-metadata sha256 build
//
// regenerates both after a version change.
dependencyLocking {
	lockAllConfigurations()
}

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

// MIMA decides which Maven Resolver comes in, and we use Resolver's own classes
// (JavaScopes, the descriptor policy) directly, so that one has to be declared
// too: keep it at the version MIMA brings, which the pom of the MIMA release
// names. The lock file makes a divergence visible in review.
def mimaVersion = "2.4.48"
def resolverVersion = "1.9.27"
def slf4jVersion = "2.0.18"

dependencies {
	// nullness annotations, required by the files mirrored from JBang
	implementation 'org.jspecify:jspecify:1.0.0'

	// Maven dependency resolution (the one thing we really cannot re-implement
	// ourselves), with the HTTP transport Maven itself ships
	implementation "eu.maveniverse.maven.mima:context:$mimaVersion"
	implementation "eu.maveniverse.maven.mima.runtime:standalone-static:$mimaVersion"
	implementation "org.apache.maven.resolver:maven-resolver-util:$resolverVersion"
	implementation "org.slf4j:slf4j-nop:$slf4jVersion"

	// JSON, for the JDK index. Comes with maven-resolver-transport-http anyway;
	// declared because we use it ourselves
	implementation "com.google.code.gson:gson:2.14.0"

	// archive handling, for unpacking a downloaded JDK
	implementation "org.apache.commons:commons-compress:1.28.0"

	constraints {
		// the HTTP transport brings the 1.7 line of the commons-logging bridge
		// while everything else is on 2.0; one SLF4J, not one and a half
		implementation("org.slf4j:jcl-over-slf4j:$slf4jVersion") {
			because "aligned with the rest of SLF4J"
		}
	}

	testImplementation platform("org.junit:junit-bom:5.14.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "org.hamcrest:hamcrest:3.0"
	// only for the launcher script tests, never shipped
	testImplementation "org.wiremock:wiremock:3.13.2"
}

test {
	useJUnitPlatform()
	// The launcher tests run the scripts out of the source tree, which Gradle
	// cannot see from the Java sources. Without this, editing a script leaves
	// the test task up to date and the tests that cover it never run.
	inputs.files(fileTree('src/main/scripts')).withPropertyName('scripts')
		.withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.files(fileTree('dist')).withPropertyName('dist')
		.withPathSensitivity(PathSensitivity.RELATIVE)
	// A download asks before it starts, and a test run has no terminal to answer
	// on. Left to itself the gate would say what it is fetching and carry on,
	// which is what "auto" does with nobody to ask - but then CI would depend on
	// that default staying permissive. It is said here instead. The tests that
	// are about the gate remove this from the environment they hand their
	// subprocesses.
	environment 'JKITE_CONFIRM_DOWNLOADS', 'never'
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll(['--release', '11', '-Xlint:deprecation', '-Xlint:-options'])
}

tasks.withType(AbstractArchiveTask) {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	manifest {
		attributes(
			'Main-Class': 'io.github.instreest.jkite.Main',
			// the attribute Package.getImplementationVersion() reads back
			'Implementation-Version': project.version,
			// and the one that says a manifest is ours, among the many a class
			// path holds
			'Jkite-Version': project.version
		)
	}
}

import com.github.jengelman.gradle.plugins.shadow.transformers.ApacheLicenseResourceTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.ApacheNoticeResourceTransformer

shadowJar {
	mergeServiceFiles()
	// The bundled libraries each carry their own META-INF/LICENSE and NOTICE,
	// and one file cannot hold several: without these the last one written wins
	// and the rest are lost, which is exactly what Apache-2.0 section 4(d) asks
	// us not to do. They merge the notices into one file instead.
	transform(ApacheLicenseResourceTransformer)
	transform(ApacheNoticeResourceTransformer) {
		// Without these the generated header names the Apache Software
		// Foundation as this project's copyright holder, which it is not.
		projectName = 'jkite'
		organizationName = 'Max Rydahl Andersen and the jkite contributors'
		organizationURL = 'https://github.com/instreest/jkite'
		inceptionYear = '2020'
	}
	// keep this fork's own notices next to the bundled code, and the licenses
	// of the bundled libraries, which the transformers above do not carry over
	from('LICENSE') { into 'META-INF'; rename { 'LICENSE-jkite.txt' } }
	from('THIRD-PARTY.md') { into 'META-INF'; rename { 'THIRD-PARTY.md' } }
	from('misc/licenses') { into 'META-INF/licenses' }
	// a bundled library's module-info describes that library, not this jar
	exclude 'META-INF/versions/*/module-info.class'
	exclude 'module-info.class'
	// likewise META-INF/DEPENDENCIES: it is one dependency's own list, and in
	// this jar it reads as ours while naming versions that are not here
	exclude 'META-INF/DEPENDENCIES'
	manifest {
		attributes(
			'Main-Class': 'io.github.instreest.jkite.Main',
			// what Version.current() asks for first: Package resolves it to the
			// jar this class came from, not to whichever jar is first on the
			// class path
			'Implementation-Version': project.version,
			// and the one that marks a manifest as ours, for when Package
			// cannot answer
			'Jkite-Version': project.version,
			// plexus-utils ships Java 9/10/11 variants of two classes; without
			// this they are dead weight and the Java 8 versions are used
			'Multi-Release': 'true'
		)
	}
	archiveFileName = "jkite.jar"
}

assemble.dependsOn shadowJar

// --- native image -------------------------------------------------------
//
// A second way to ship the same code: one executable that needs no JVM to
// start. It matters here because the launcher scripts install a whole JDK
// for the single purpose of running jkite.jar (see jkite.properties); an
// executable that starts on its own removes that reason, and with it the
// jkite-bootstrap-jdk pair.
//
// native-image does not cross-compile: an executable is always built for the
// machine building it. So the platform is read from the build JVM rather
// than chosen, and CI gets one runner per platform it ships.

// The name this platform has in jkite.properties, e.g. linux-amd64. The same
// six the bootstrap scripts resolve, named the same way, so a built artifact
// drops straight into that table.
def nativePlatform() {
	def os = System.getProperty("os.name").toLowerCase()
	def arch = System.getProperty("os.arch").toLowerCase()
	def osName = os.contains("windows") ? "windows"
			: (os.contains("mac") || os.contains("darwin")) ? "darwin"
			: "linux"
	def archName = (arch == "aarch64" || arch == "arm64") ? "arm64" : "amd64"
	return "$osName-$archName"
}

// Anything released here is pinned by SHA-256, the way jkite.properties pins
// the jar and the bootstrap JDKs, so whatever produces a file writes the digest
// beside it instead of leaving it to be computed by hand afterwards.
def reportArtifact(File file) {
	def digest = java.security.MessageDigest.getInstance("SHA-256")
	file.eachByte(64 * 1024) { buf, n -> digest.update(buf, 0, n) }
	def hex = digest.digest().encodeHex().toString()
	new File(file.parentFile, "${file.name}.sha256").text = "$hex  ${file.name}\n"
	println "native-image: ${file.name} (${file.length().intdiv(1024 * 1024)} MB)"
	println "native-image: sha256 $hex"
	return hex
}

tasks.register('nativeImage', Exec) {
	dependsOn shadowJar
	description = "Build a native executable for the platform this build runs on"
	group = "build"

	def windows = System.getProperty("os.name").toLowerCase().contains("windows")
	def platform = nativePlatform()
	def outputDir = layout.buildDirectory.dir("native-image").get().asFile
	// native-image appends .exe on Windows, so the name it is given must not
	// already carry one or the file ends up called jkite-...exe.exe
	def execBase = "jkite-$platform"
	def execFile = new File(outputDir, windows ? "${execBase}.exe" : execBase)

	// GRAALVM_HOME is how CI points at the GraalVM it set up; without it the
	// command has to be on PATH, which is what a local install usually gives.
	def tool = windows ? "native-image.cmd" : "native-image"
	def cmd = System.getenv("GRAALVM_HOME")
			? "${System.getenv('GRAALVM_HOME')}${File.separator}bin${File.separator}$tool"
			: tool

	// jkite needs no reachability metadata today: it reads JSON through gson's
	// tree API rather than binding it to classes, and opens archives by
	// constructing the streams rather than looking them up by service. The
	// directory is passed only if it exists, so the day something does need an
	// entry, creating the file is the whole change.
	def configDir = file("src/native-image/config")
	// Gradle cannot see either of these from the task's own declaration: the
	// jar comes through dependsOn, which orders the tasks but does not make
	// its content an input, and the metadata is read by native-image rather
	// than by Gradle. Without both, editing metadata leaves the task up to
	// date and the executable keeps whatever was baked into it before.
	inputs.file(shadowJar.archiveFile)
	inputs.files(fileTree(configDir)).withPropertyName("nativeImageConfig")
		.withPathSensitivity(PathSensitivity.RELATIVE)

	doFirst {
		outputDir.mkdirs()
		def args = [cmd, "-jar", shadowJar.archiveFile.get().asFile.path,
					"${outputDir}${File.separator}$execBase",
					// fail the build rather than emit an image that needs a JVM
					"--no-fallback",
					"--enable-https",
					// the jar: URLs the class path scan walks
					"--enable-url-protocols=jar",
					// report a missing registration at build time, not as a
					// surprise at run time
					"--exact-reachability-metadata",
					"-H:+ReportExceptionStackTraces",
					// leave -Dkey=value for jkite instead of consuming it
					"-H:-ParseRuntimeOptions",
					// optimise for size rather than for throughput. It takes
					// about a fifth off the executable and costs nothing that
					// matters here: measured start was unchanged, and a
					// process that starts, builds one program and exits never
					// reaches the speed -O2 is buying.
					"-Os"]
		if (configDir.isDirectory()) {
			args += "-H:ConfigurationFileDirectories=$configDir"
		}
		commandLine args
		println "native-image: building $execFile"
	}

	doLast {
		reportArtifact(execFile)
	}

	outputs.file(execFile)
}

// What actually gets published, rather than the bare executable. A .tgz
// because it is the one format both sides unpack with what they already have:
// Windows reads it with the tar it ships (there is no gzip.exe, and a bare .gz
// is refused as an unrecognized archive), and the POSIX bootstrap already
// pipes gzip into tar to install a JDK. It also carries the executable bit,
// which a zip carries only if whatever wrote it chose to - and nothing here
// chmods after unpacking.
//
// It is paid once per machine rather than once per run, which is the whole
// reason the compression is here and not in the executable: 33 MB becomes
// about 12 MB, while packing the executable itself (UPX) would cost 115 ms on
// every start.
tasks.register('nativeImageArchive', Tar) {
	dependsOn 'nativeImage'
	description = "Package the native executable as jkite-<platform>.tgz"
	group = "build"

	def windows = System.getProperty("os.name").toLowerCase().contains("windows")
	def execBase = "jkite-${nativePlatform()}"
	def outputDir = layout.buildDirectory.dir("native-image").get().asFile
	def execFile = new File(outputDir, windows ? "${execBase}.exe" : execBase)

	compression = Compression.GZIP
	// .tgz rather than .tar.gz: both tars read it by content, not by name, and
	// Windows hides known extensions, which turns jkite-x.tar.gz into
	// jkite-x.tar in every file listing a person sees.
	archiveFileName = "${execBase}.tgz"
	destinationDirectory = layout.buildDirectory.dir("native-image")

	from(execFile) {
		// Gradle does not carry the source file's mode into the archive, so
		// without this the executable unpacks as 0644 and cannot be run.
		filePermissions { unix("0755") }
	}

	doLast {
		reportArtifact(archiveFile.get().asFile)
	}
}
