# Builds the native executable on every platform jkite.properties names.
#
# native-image does not cross-compile: an executable is built for the machine
# that builds it. So this is not one job with a flag, it is one runner per
# platform, and the matrix below is the list of platforms jkite can ship.
#
# Five of jkite.properties' six platforms are built here, all on GitHub-hosted
# runners. arm64 Linux and Windows runners became generally available for
# public repositories in August 2025, which is what makes that much complete
# without self-hosted machines or QEMU.
#
# darwin-amd64 is the one that is missing, and it is missing because there is
# no compiler for it: GraalVM removed macOS x64 after 25.0.1, so every release
# from 25.0.2 on ships no macos-x64 build at all. Pinning an Intel Mac job to
# 25.0.1 would freeze it on a release that no longer gets fixes, which is worse
# than not shipping a binary. Intel Macs run the jar, which is what the jar is
# for. (GitHub is retiring macos-15-intel in August 2027 in any case.)
#
# Native builds are minutes each, so this does not run on every push the way
# CI does: it runs on demand, on release tags, and on pull requests that touch
# the build or the metadata, which are the changes that can break it.
name: Native

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'build.gradle'
      - 'gradle.lockfile'
      - 'src/native-image/**'
      - '.github/workflows/native.yml'

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      # one platform failing must not hide the result of the others
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux-amd64   }
          - { os: ubuntu-24.04-arm, platform: linux-arm64   }
          - { os: windows-latest,   platform: windows-amd64 }
          - { os: windows-11-arm,   platform: windows-arm64 }
          - { os: macos-latest,     platform: darwin-arm64  }
          # no darwin-amd64: GraalVM ships no macOS x64 build after 25.0.1

    steps:
      - uses: actions/checkout@v4

      # GraalVM is both the JDK the build runs on and the source of the
      # native-image command, so no second setup-java step is needed. The
      # action exports GRAALVM_HOME, which is what the nativeImage task looks
      # for.
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the native executable and its archive
        shell: bash
        run: ./gradlew nativeImageArchive --stacktrace

      # What is tested is the archive rather than the build directory, because
      # the archive is what ships: unpacking it the way a machine installing
      # jkite would is the only thing that shows the tar carries the executable
      # bit. It is one command on every runner - Windows reads a .tgz with the
      # tar it ships, which is why the format is a .tgz and not a bare .gz.
      #
      # Nothing chmods here, deliberately. A chmod would hide exactly the
      # failure this step exists to catch.
      - name: Smoke test the published archive
        shell: bash
        env:
          JKITE_CONFIRM_DOWNLOADS: never
        run: |
          set -euo pipefail
          mkdir -p smoke
          tar -xf build/native-image/jkite-${{ matrix.platform }}.tgz -C smoke
          exe=smoke/jkite-${{ matrix.platform }}
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          "$exe" --version
          cat > hello.java <<'EOF'
          public class hello {
            public static void main(String[] a) { System.out.println("ok"); }
          }
          EOF
          test "$("$exe" hello.java)" = "ok"

      # The archive and its digest, which is what a release publishes and what
      # jkite.properties will point at. The executable itself is inside it.
      - uses: actions/upload-artifact@v4
        with:
          name: jkite-${{ matrix.platform }}
          path: |
            build/native-image/jkite-${{ matrix.platform }}.tgz
            build/native-image/jkite-${{ matrix.platform }}.tgz.sha256
          if-no-files-found: error
          retention-days: 7
